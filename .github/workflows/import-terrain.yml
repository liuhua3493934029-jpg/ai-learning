name: import-terrain
on:
  push:
    branches: [theme/deepseek]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: theme/deepseek
      - name: Fetch and unpack
        run: |
          curl -L --fail --retry 3 -o /tmp/site.zip "https://aka.doubaocdn.com/s/E5o3Qfwnde"
          unzip -o /tmp/site.zip -d .
      - name: Commit the survey
        run: |
          git config user.name "terrain-import"
          git config user.email "terrain-import@users.noreply.github.com"
          git rm -f .github/workflows/import-terrain.yml
          git add -A
          git commit -m "Import 山海 terrain theme (rounds 1-2)"
          git push origin HEAD:theme/deepseek
