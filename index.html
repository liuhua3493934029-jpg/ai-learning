<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 工作流学习路线</title><meta name="theme-color" content="#101722"><style>
:root{color-scheme:dark;font-family:system-ui,'Microsoft YaHei',sans-serif;--bg:#101722;--panel:#1a2635;--edge:#304054;--text:#eaf1fa;--muted:#a0b0c3;--green:#83e0b8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#223e52,var(--bg) 580px);color:var(--text)}main{max-width:860px;margin:auto;padding:22px 15px 65px}header,.card,footer{border:1px solid var(--edge);background:var(--panel);border-radius:16px;padding:20px;margin-bottom:14px}header{background:linear-gradient(135deg,#213c4b,#182537);padding:27px}h1{font-size:clamp(26px,5vw,37px);margin:5px 0 10px}h2{font-size:20px;margin:29px 0 6px}h3{font-size:16px;margin:0 0 9px;line-height:1.5}p{color:var(--muted);line-height:1.65;margin:6px 0}.kicker{font-size:12px;font-weight:700;letter-spacing:.13em;color:var(--green)}.progress{background:#364657;border-radius:20px;overflow:hidden;height:9px;margin:16px 0 9px}.fill{height:100%;background:linear-gradient(90deg,#41a990,#91e5ba);width:0;transition:width .25s}.stat{display:flex;justify-content:space-between;gap:10px;align-items:center}.stat strong{font-size:20px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:25px 0 10px}button,.link{font:inherit;font-size:13px;cursor:pointer;border:1px solid #46617d;color:#e8f1fa;background:#273a51;padding:9px 12px;border-radius:9px;text-decoration:none;display:inline-block}button:hover,.link:hover{filter:brightness(1.16)}button.active,.donebtn{background:#205346;border-color:#64ac8f;color:#c9ffe4}.link{background:#316fc3;border-color:#316fc3}button:focus-visible,a:focus-visible{outline:2px solid var(--green);outline-offset:2px}.card{display:grid;grid-template-columns:32px minmax(0,1fr);gap:13px}.card.done{border-color:#3b725e}.card.next{outline:1px solid #80d9ad}.card.skip{opacity:.76}.step{background:#2c4056;border-radius:9px;height:32px;width:32px;display:grid;place-items:center;font-size:12px}.card.done .step{background:#28604b}.meta{font-size:12px;color:#8fbeeb}.note{font-size:12px}.badge{font-size:11px;background:#2b3d52;padding:4px 8px;border-radius:6px;color:#bed0e5;white-space:nowrap}.badge.success{background:#235140;color:#a8f1cd}.badge.warn{background:#5b422e;color:#f0ce9b}.titleline{display:flex;align-items:start;justify-content:space-between;gap:9px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}.section-info{font-size:13px;margin:3px 0 15px}.foot{font-size:12px}.empty{padding:24px;color:var(--muted);border:1px dashed var(--edge);border-radius:12px}@media(max-width:530px){header,.card,footer{padding:16px}.card{grid-template-columns:27px minmax(0,1fr);gap:10px}.step{width:27px;height:27px}.titleline{flex-wrap:wrap}.chips button{padding:8px 10px}}
</style></head><body><main>
<header><div class="kicker">LESS VIDEOS · MORE BUILDING</div><h1>AI 工作流学习路线</h1><p>以 OpenAI、Anthropic、DeepLearning.AI 等专业机构课程为主，去重后按照 Skills → 规格驱动 → 协作 → 代码审查 → MCP → Agent 评估学习。</p><div class="stat"><strong id="count">3 / 10</strong><span id="pct">30%</span></div><div class="progress"><div id="fill" class="fill"></div></div><p id="next"></p></header>
<nav class="chips" aria-label="课程分类"><button data-tab="core" class="active">主线必修</button><button data-tab="optional">进阶选修</button><button data-tab="archive">去重归档</button><button data-tab="skipped">已跳过</button><button data-tab="all">全部课程</button></nav>
<div id="courses"></div><footer><div class="actions"><button id="export">导出进度</button><button id="import">导入进度</button><button id="reset">重置进度</button></div><input id="file" type="file" accept="application/json,.json" hidden><p class="foot">保留原版前 3 门已完成的记录；第 4 门收费、第 14 门音量过小，默认已跳过。旧版浏览器进度会自动迁移，完成率只计算主线。进度仅存储在当前浏览器，请定期备份。部分课程免费开放视频，但实验、测验或证书可能收费，以官方页面为准。</p></footer>
</main><script>
const courses=[
{id:'old-1',group:'core',title:'Codex 完整实战',source:'森虫虫进化中 · B 站 · 59 分钟',desc:'Codex 基础操作和完整软件开发。',note:'原第 1 门，已完成。',url:'https://www.bilibili.com/video/BV12igX6RE1i/'},
{id:'old-2',group:'core',title:'Codex 制作视频实战',source:'在下小苏 · B 站',desc:'视频制作、任务调整与返工优化。',note:'原第 2 门，已完成。',url:'https://www.bilibili.com/video/BV1AQGA6EEDq/'},
{id:'old-3',group:'core',title:'Codex AI 日报项目',source:'B 站',desc:'GitHub 部署、Skill 与定时自动化。',note:'原第 3 门，已完成。',url:'https://www.bilibili.com/video/BV1kSjA6WEnQ/'},
{id:'old-5',group:'core',title:'Agent Skills with Anthropic',source:'DeepLearning.AI × Anthropic',desc:'Skills 基础、SKILL.md 文件结构、与 MCP 的区别及自定义 Skill。',note:'学完创建一个能用在 Codex 中的 Skill。',url:'https://www.deeplearning.ai/courses/agent-skills-with-anthropic'},
{id:'old-6',group:'core',title:'Codex + Skills 专项教程',source:'B 站 · 共 17 节，精选观看',desc:'在 Codex 中创建、调用、测试 Skill。',note:'只看 Codex 实操章节；与上一课重复的原理部分跳过。',url:'https://www.bilibili.com/video/BV1ideg65EX6/'},
{id:'new-spec',group:'core',title:'Spec-Driven Development with Coding Agents',source:'DeepLearning.AI × JetBrains',desc:'需求规范、任务规划、逐步实现与验收验证。',note:'从“让 AI 写代码”升级为“先定义正确的需求”。',url:'https://www.deeplearning.ai/courses/spec-driven-development-with-coding-agents'},
{id:'old-11',group:'core',title:'Codex Bootcamp 201',source:'OpenAI Academy · 官方录播',desc:'团队协作、共享上下文、项目流程和工具连接。',note:'Skills 基础重复部分可跳过。',url:'https://academy.openai.com/public/videos/september-30-codex-bootcamp-201-2026-10-01'},
{id:'new-review',group:'core',title:'AI Code Review',source:'DeepLearning.AI × Qodo',desc:'代码审查、风险判断、项目级错误识别和审查 Agent。',note:'可用已有 Python 项目进行练习。',url:'https://www.deeplearning.ai/courses/ai-code-review'},
{id:'new-mcp',group:'core',title:'MCP: Build Rich-Context AI Apps with Anthropic',source:'DeepLearning.AI × Anthropic',desc:'MCP Client/Server、工具调用及亲手构建服务端。',note:'重点学工具集成原理，而不是重复安装插件。',url:'https://www.deeplearning.ai/courses/mcp-build-rich-context-ai-apps-with-anthropic'},
{id:'new-eval',group:'core',title:'Evaluating AI Agents',source:'DeepLearning.AI × Arize AI',desc:'Agent 跟踪、测试集、质量评估与失败案例分析。',note:'学习如何客观衡量 AI 工作流效果。',url:'https://www.deeplearning.ai/courses/evaluating-ai-agents'},
{id:'old-12',group:'optional',title:'Codex Bootcamp 301',source:'OpenAI Academy',desc:'高级自动化、多 Agent、SDK 与工程工作流。',note:'建议主线基本完成后再看。',url:'https://academy.openai.com/public/videos/codex-bootcamp-301-advanced-automation-2026-10-07'},
{id:'new-claude',group:'optional',title:'Claude Code in Action',source:'Anthropic Claude Academy · 图文及实操',desc:'CLAUDE.md、Skills、Hooks、权限与验证。',note:'适合替代长篇重复的 Claude Code 基础视频；不是纯视频课。',url:'https://academy.claude.com/courses/claude-code-in-action'},
{id:'new-live',group:'optional',title:'Claude Code Live',source:'Anthropic · 官方录播',desc:'开发团队介绍真实项目中的 Claude Code 工作流。',note:'在打算深入 Claude Code 时观看。',url:'https://resources.anthropic.com/webinar/claude-code-live'},
{id:'new-smol',group:'optional',title:'Building Code Agents with Hugging Face smolagents',source:'DeepLearning.AI × Hugging Face',desc:'Python 自建代码 Agent、工具、沙箱与监控。',note:'适合 Python 基础更稳固后学习。',url:'https://www.deeplearning.ai/courses/building-code-agents-with-hugging-face-smolagents'},
{id:'new-arch',group:'optional',title:'Designing Reliable Agent Architectures',source:'OpenAI Academy · 官方录播',desc:'可靠 Agent 架构、工具编排与故障处理。',note:'生产级架构方向，按需选修。',url:'https://academy.openai.com/public/clubs/builders-etkn1/videos/ai-techniques-production-designing-reliable-agent-architectures-2025-12-11'},
{id:'old-8',group:'optional',title:'Dynamic Workflows',source:'Mark Kashef · YouTube · 约 12 分钟',desc:'动态多 Agent 工作流简介。',note:'与 Bootcamp 301 部分重叠，可以择一看。',url:'https://www.youtube.com/watch?v=9_ExDZFlaNc'},
{id:'old-7',group:'archive',title:'Claude Code Full Course',source:'Nick Saraev · YouTube · 约 4 小时',desc:'完整 Claude Code 入门和实战。',note:'基础部分与官方课程重复，归档保存。',url:'https://www.youtube.com/watch?v=QoQBzR1NIqI'},
{id:'old-9',group:'archive',title:'Claude Code 零基础全套教程',source:'B 站 · 约 8 小时',desc:'大量入门操作、Git 与项目讲解。',note:'与 Claude Code 其他课程高度重合。',url:'https://www.bilibili.com/video/BV1gL3j64ENQ/'},
{id:'old-10',group:'archive',title:'Codex Bootcamp 101',source:'OpenAI Academy · 官方录播',desc:'Agentic Coding 基础。',note:'可靠但基础重复，可从 201 开始。',url:'https://academy.openai.com/public/videos/september-23-codex-bootcamp-101-2026-09-24'},
{id:'old-13',group:'archive',title:'从零开始的 AI 游戏开发',source:'B 站 · 约 11 分钟',desc:'AI 游戏开发演示。',note:'你已有游戏项目经验，按兴趣回看即可。',url:'https://www.bilibili.com/video/BV11xFxzhEHv/'},
{id:'old-4',group:'skipped',title:'90 分钟 Codex 入门到进阶：22 个案例',source:'GenJi · B 站',desc:'原第 4 门。',note:'收费，跳过，不计进度。',url:'https://www.bilibili.com/video/BV19W8M69ELt'},
{id:'old-14',group:'skipped',title:'Shiki 实验室：Codex 工作流',source:'B 站 · 约 27 分钟',desc:'原第 14 门。',note:'音量太小，跳过，不计进度。',url:'https://www.bilibili.com/video/BV1fmKc6DEWk/'}];
const oldIds=['old-1','old-2','old-3','old-4','old-5','old-6','old-7','old-8','old-9','old-10','old-11','old-12','old-13','old-14'];
const defaults={'old-1':'done','old-2':'done','old-3':'done','old-4':'skip','old-14':'skip'};
const groups={core:['主线必修','按顺序学习，已经完成前三门。'],optional:['进阶选修','根据具体项目选学，不影响主线进度。'],archive:['去重归档','保留链接和学习记录，不建议重复学习。'],skipped:['已跳过','因收费和音量原因跳过，不视为完成。']};
const key='ai_learning_tracker_v2',legacyKey='ai_learning_tracker_v1';let state,tab='core';
function fromLegacy(arr){const s={...defaults};if(!Array.isArray(arr)||arr.some(i=>!Number.isInteger(i)||i<0||i>=oldIds.length))throw Error('格式错误');arr.forEach(i=>{if(Number.isInteger(i)&&i>=0&&i<oldIds.length&&i!==3&&i!==13)s[oldIds[i]]='done'});return s}
function normalize(s){if(!s||typeof s!=='object'||Array.isArray(s))throw Error('格式错误');const r={...defaults};for(const [id,v] of Object.entries(s)){if(!courses.some(c=>c.id===id)||!['done','todo','skip'].includes(v))throw Error('格式错误');r[id]=v}r['old-4']='skip';r['old-14']='skip';return r}
function load(){try{const v=localStorage.getItem(key);if(v){const o=JSON.parse(v);if(o.version!==2)throw Error('格式错误');return normalize(o.statuses)}}catch{}try{const old=localStorage.getItem(legacyKey);if(old){const migrated=fromLegacy(JSON.parse(old));try{localStorage.setItem(key,JSON.stringify({version:2,statuses:migrated}))}catch{}return migrated}}catch{}return {...defaults}}
state=load();
function save(){try{localStorage.setItem(key,JSON.stringify({version:2,statuses:state}))}catch{alert('本地保存失败，请检查浏览器存储权限')}}
function node(t,cl,text){const e=document.createElement(t);if(cl)e.className=cl;if(text!==undefined)e.textContent=text;return e}
function render(){const core=courses.filter(c=>c.group==='core'),done=core.filter(c=>state[c.id]==='done').length;document.getElementById('count').textContent=done+' / '+core.length;document.getElementById('pct').textContent=Math.round(done/core.length*100)+'%';document.getElementById('fill').style.width=(done/core.length*100)+'%';const next=core.find(c=>state[c.id]!=='done'&&state[c.id]!=='skip');document.getElementById('next').textContent=next?'下一课：'+next.title:done===core.length?'主线已完成':'主线已学完（含跳过课程）';document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-pressed',String(b.dataset.tab===tab))});const root=document.getElementById('courses');root.replaceChildren();for(const group of Object.keys(groups)){if(tab!=='all'&&tab!==group)continue;const items=courses.filter(c=>c.group===group),section=node('section');section.appendChild(node('h2','',groups[group][0]+' · '+items.length+' 门'));section.appendChild(node('p','section-info',groups[group][1]));items.forEach((c,i)=>{const s=state[c.id]||'todo',el=node('article','card'+(s==='done'?' done':'')+(s==='skip'?' skip':'')+(c.id===next?.id?' next':'')),n=node('span','step',s==='done'?'✓':String(i+1).padStart(2,'0')),body=node('div'),head=node('div','titleline'),badge=node('span','badge'+(s==='done'?' success':s==='skip'?' warn':''),s==='done'?'已完成':s==='skip'?'已跳过':c.id===next?.id?'下一课':group==='optional'?'选修':group==='archive'?'已归档':'待学习');head.append(node('h3','',c.title),badge);body.append(head,node('p','meta',c.source),node('p','',c.desc),node('p','note',c.note));const actions=node('div','actions'),link=node('a','link','打开课程 ↗');link.href=c.url;link.target='_blank';link.rel='noopener noreferrer';actions.append(link);if(group!=='skipped'){const b=node('button',s==='done'?'donebtn':'',s==='done'?'✓ 已完成（撤销）':'标记完成');b.onclick=()=>{state[c.id]=s==='done'?'todo':'done';save();render()};actions.append(b)}body.append(actions);el.append(n,body);section.append(el)});root.append(section)}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.getElementById('reset').onclick=()=>{if(confirm('恢复为前 3 门已完成、4 和 14 已跳过？')){state={...defaults};save();render()}};
document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:2,statuses:state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='AI学习进度备份-v2.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
document.getElementById('import').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(!o||typeof o!=='object')throw Error('格式错误');state=Array.isArray(o)?fromLegacy(o):Array.isArray(o.completed)?fromLegacy(o.completed):o.version===2?normalize(o.statuses):(()=>{throw Error('格式错误')})();save();render();alert('进度导入成功')}catch{alert('无法导入：备份格式不正确')}e.target.value=''};render();
</script></body></html>
