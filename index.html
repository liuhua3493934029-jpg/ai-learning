<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 学习进度</title><style>:root{font-family:system-ui,'Microsoft YaHei',sans-serif;color-scheme:dark}body{margin:0;background:#10151f;color:#eef2f8}main{max-width:820px;margin:auto;padding:28px 16px 70px}h1{margin-bottom:6px}p{color:#9aa9be}header,.item{background:#1a2331;border:1px solid #2c394b;border-radius:15px;padding:20px;margin:14px 0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:#aab8cb;font-size:14px}.bar{height:10px;background:#344155;border-radius:10px;overflow:hidden;margin-top:14px}.fill{height:100%;background:#67c5a2;transition:width .2s}.item{display:flex;align-items:flex-start;gap:14px}.item.done{opacity:.68}.num{background:#344155;border-radius:10px;min-width:34px;text-align:center;padding:8px 0}.body{flex:1}.body h3{margin:0 0 7px;font-size:17px}.body p{margin:4px 0 12px;font-size:14px}.actions{display:flex;flex-wrap:wrap;gap:9px}button,a.btn{font:inherit;font-size:14px;border-radius:9px;padding:9px 13px;cursor:pointer;text-decoration:none;background:#2b384c;color:white;border:1px solid #53627a}a.btn{background:#3475d2;border-color:#3475d2}button:hover,a.btn:hover{filter:brightness(1.16)}button.donebtn{background:#235847;border-color:#357c65}.next{outline:2px solid #67c5a2}.tag{font-size:12px;color:#79d5b3;margin-bottom:7px}.small{font-size:12px;color:#8d9db2;margin-top:24px}#reset{margin-top:12px}input[type=checkbox]{width:19px;height:19px;accent-color:#67c5a2;cursor:pointer;margin-top:10px}</style></head><body><main><h1>AI 工作流学习计划</h1><p>视频课程 · Skill · Codex · Agent 工作流</p><header><div class="top"><strong id="progress">3 / 14 已完成</strong><span id="percent">21%</span></div><div class="bar"><div class="fill" id="fill"></div></div><p id="nextlabel"></p></header><div id="list"></div><button id="reset">恢复初始进度（前 3 项完成）</button><p class="small">进度只保存在当前浏览器的本地存储中。清除浏览器网站数据、使用无痕模式或换浏览器可能丢失进度。建议定期导出备份。</p><button id="export">导出进度备份</button> <button id="import">导入进度备份</button><input type="file" id="file" accept="application/json" hidden></main><script>
const lessons=[
['Codex 完整实战','森虫虫进化中 · 59 分钟','https://www.bilibili.com/video/BV12igX6RE1i/','基础操作与完整软件开发'],
['Codex 制作视频实战','在下小苏 · 时长未核实','https://www.bilibili.com/video/BV1AQGA6EEDq/','视频制作流程与返工优化'],
['Codex 入门到实战：AI 日报项目','B站 · 时长未核实','https://www.bilibili.com/video/BV1kSjA6WEnQ/','GitHub 部署、Skill、定时自动化'],
['90 分钟 Codex 入门到进阶：22 个案例','GenJi · 91 分钟','https://www.bilibili.com/video/BV19W8M69ELt','观察不同任务的实际工作流'],
['Agent Skills with Anthropic','吴恩达 · 约 2 小时 28 分钟','https://www.bilibili.com/video/BV1qv6eBZErD/','Skill 原理、结构与创建'],
['Codex + Skills 专项教程','B站 · 17 节','https://www.bilibili.com/video/BV1ideg65EX6/','在 Codex 中创建和测试 Skill'],
['Claude Code Full Course','Nick Saraev · 约 4 小时','https://www.youtube.com/watch?v=QoQBzR1NIqI','完整项目、测试、Git、Agent'],
['Dynamic Workflows','Mark Kashef · 约 12 分钟','https://www.youtube.com/watch?v=9_ExDZFlaNc','多 Agent 与动态工作流'],
['Claude Code 零基础全套教程','B站 · 约 8 小时','https://www.bilibili.com/video/BV1gL3j64ENQ/','选看 Harness、Git、Python 项目'],
['Codex Bootcamp 101','OpenAI Academy','https://academy.openai.com/public/videos/september-23-codex-bootcamp-101-2026-09-24','Agentic Coding 基础'],
['Codex Bootcamp 201','OpenAI Academy','https://academy.openai.com/public/videos/september-30-codex-bootcamp-201-2026-10-01','团队工作流'],
['Codex Bootcamp 301','OpenAI Academy','https://academy.openai.com/public/videos/codex-bootcamp-301-advanced-automation-2026-10-07','高级自动化'],
['从零开始的 AI 游戏开发','B站 · 约 11 分钟','https://www.bilibili.com/video/BV11xFxzhEHv/','AI 游戏制作案例'],
['Shiki 实验室：Codex 工作流','B站 · 27 分钟 · 音量偏低，可跳过','https://www.bilibili.com/video/BV1fmKc6DEWk/','选修：工作流设计']
];
const key='ai_learning_tracker_v1';let completed;try{const raw=JSON.parse(localStorage.getItem(key));completed=Array.isArray(raw)?raw.filter(x=>Number.isInteger(x)&&x>=0&&x<lessons.length):[0,1,2]}catch{completed=[0,1,2]}
function save(){localStorage.setItem(key,JSON.stringify(completed))}function render(){const next=lessons.findIndex((_,i)=>!completed.includes(i));document.getElementById('progress').textContent=`${completed.length} / ${lessons.length} 已完成`;document.getElementById('percent').textContent=Math.round(completed.length/lessons.length*100)+'%';document.getElementById('fill').style.width=completed.length/lessons.length*100+'%';document.getElementById('nextlabel').textContent=next<0?'全部完成！':`下一项：第 ${next+1} 部 · ${lessons[next][0]}`;const root=document.getElementById('list');root.replaceChildren();lessons.forEach((l,i)=>{const done=completed.includes(i),box=document.createElement('article');box.className='item'+(done?' done':'')+(i===next?' next':'');const check=document.createElement('input');check.type='checkbox';check.checked=done;check.setAttribute('aria-label',`标记第${i+1}部完成`);check.onchange=()=>toggle(i);const body=document.createElement('div');body.className='body';if(i===next){const tag=document.createElement('div');tag.className='tag';tag.textContent='▶ 当前学习';body.append(tag)}const h=document.createElement('h3');h.textContent=l[0];const meta=document.createElement('p');meta.textContent=l[1]+' · '+l[3];const actions=document.createElement('div');actions.className='actions';const link=document.createElement('a');link.className='btn';link.href=l[2];link.target='_blank';link.rel='noopener noreferrer';link.textContent='打开课程 ↗';const btn=document.createElement('button');btn.className=done?'donebtn':'';btn.textContent=done?'✓ 已完成（点击撤销）':'标记完成';btn.onclick=()=>toggle(i);actions.append(link,btn);body.append(h,meta,actions);box.append(check,body);root.append(box)})}function toggle(i){completed=completed.includes(i)?completed.filter(x=>x!==i):[...completed,i].sort((a,b)=>a-b);save();render()}
document.getElementById('reset').onclick=()=>{if(confirm('确定将进度恢复到前 3 项已完成吗？')){completed=[0,1,2];save();render()}};document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,completed,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='AI学习进度备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.getElementById('import').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(!Array.isArray(o.completed)||o.completed.some(x=>!Number.isInteger(x)||x<0||x>=lessons.length))throw Error('格式错误');completed=[...new Set(o.completed)].sort((a,b)=>a-b);save();render();alert('进度导入成功')}catch{alert('备份文件格式不正确')}e.target.value=''};render();
</script></body></html>
